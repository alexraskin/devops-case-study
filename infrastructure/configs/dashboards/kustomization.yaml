apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dashboard-service-health
    files:
      - service-health.json
  - name: dashboard-backend-postgres
    files:
      - backend-postgres.json
  - name: dashboard-cluster-health
    files:
      - cluster-health.json
