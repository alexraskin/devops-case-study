apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ml-api-alerts
  namespace: monitoring
spec:
  groups:
    - name: ml-api
      interval: 1m
      rules:
        # Fires when more than 5% of non-probe requests return a 5xx status for 5m.
        - alert: MlApiErrorRatioHigh
          expr: |
            sum(rate(ml_api_requests_total{endpoint!~"/health|/ready", status=~"5.."}[5m]))
              / sum(rate(ml_api_requests_total{endpoint!~"/health|/ready"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: warning
            service: ml-api
          annotations:
            summary: "ml-api: high 5xx error ratio"
            description: "{{ $value | humanizePercentage }} of requests are returning 5xx (threshold 5%)."

        # Healthy /predict p95 is ~0.25-0.5s.
        - alert: MlApiLatencyHigh
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(ml_api_request_duration_seconds_bucket[5m]))
            ) > 1
          for: 5m
          labels:
            severity: warning
            service: ml-api
          annotations:
            summary: "ml-api: p95 latency above 1s"
            description: "p95 latency is {{ $value | humanizeDuration }}."

        # Compares the last 5m request rate to the 5m before it; fires if it fell by more than half.
        - alert: MlApiTrafficDrop
          expr: |
            sum(rate(ml_api_requests_total{endpoint!~"/health|/ready"}[5m]))
              < 0.5 * sum(rate(ml_api_requests_total{endpoint!~"/health|/ready"}[5m] offset 5m))
          for: 2m
          labels:
            severity: critical
            service: ml-api
          annotations:
            summary: "ml-api: request rate more than halved"
            description: "Now {{ $value | printf \"%.2f\" }} req/s, under half of 5 minutes ago. Check the load-generator, DNS or networking."

        # /predict is being called but no predictions are counted: the model is failing silently.
        - alert: MlApiPredictionsStalled
          expr: |
            sum(rate(ml_api_predictions_total[10m])) == 0
              and sum(rate(ml_api_requests_total{endpoint="/predict"}[10m])) > 0
          for: 5m
          labels:
            severity: critical
            service: ml-api
          annotations:
            summary: "ml-api: /predict receives traffic but no predictions are made"
            description: "Requests are reaching /predict but ml_api_predictions_total has not increased in 10 minutes."

        # `up == 1` keeps only healthy targets; absent() fires when none are left,
        # covering both failing scrapes (up=0) and targets that vanished entirely.
        - alert: MlApiTargetsMissing
          expr: |
            absent(up{job="ml-api"} == 1)
          for: 2m
          labels:
            severity: critical
            service: ml-api
          annotations:
            summary: "ml-api: no healthy scrape target"
            description: "Prometheus has no successful ml-api scrape for 2m. Pods are gone, failing, or the Service no longer selects them"
